name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "plugins/phriendly/tearoff-panes/**"
      - "editions/showcase/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build showcase wiki
        env:
          TIDDLYWIKI_PLUGIN_PATH: ${{ github.workspace }}/plugins
        run: node vendor/TiddlyWiki5/tiddlywiki.js editions/showcase --build index

      - uses: actions/upload-pages-artifact@v5
        with:
          path: editions/showcase/output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
